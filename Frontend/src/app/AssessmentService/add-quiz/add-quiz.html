<div class="quiz-wrapper">

  <h2>Create Quiz</h2>

  <!-- AUTO SELECTED MODULE DISPLAY -->
  <div *ngIf="currentModuleId" class="selected-module">
    <strong>Current Module:</strong>
    {{ modules | moduleTitle : currentModuleId }}
  </div>

  <!-- QUIZ CREATION SECTION -->
  <div [formGroup]="quizForm"
       class="quiz-form"
       [class.locked]="quizCreated">

    <!-- MODULE -->
    <label>Module <span class="required">*</span></label>
    <select formControlName="moduleId" [disabled]="quizCreated">
      <option value="">Select module</option>
      <option
        *ngFor="let m of modules"
        [value]="m.id"
        [disabled]="!unquizzedModules.includes(m.id)">
        {{ m.title }}
      </option>
    </select>
    <div class="error" *ngIf="submittedQuiz && quizForm.controls['moduleId'].invalid">
      Module is required.
    </div>

    <!-- QUIZ TITLE -->
    <label>Quiz Title <span class="required">*</span></label>
    <input formControlName="title" placeholder="Enter quiz title" [readonly]="quizCreated">
    <div class="error" *ngIf="submittedQuiz && quizForm.controls['title'].invalid">
      Quiz title is required.
    </div>

    <!-- TIME LIMIT -->
    <label>Time Limit (minutes) <span class="required">*</span></label>
    <input type="number" formControlName="timeLimitMinutes" [readonly]="quizCreated">
    <div class="error" *ngIf="submittedQuiz && quizForm.controls['timeLimitMinutes'].invalid">
      Time limit must be at least 1 minute.
    </div>

    <button class="btn-primary"
            type="button"
            (click)="createQuiz()"
            [disabled]="quizCreated">
      Create Quiz
    </button>
  </div>

  <!-- QUESTION CREATION SECTION -->
  <div *ngIf="quizCreated" class="question-section">

    <h3>Add Question</h3>

    <div [formGroup]="questionForm" class="question-form">

      <!-- QUESTION TEXT -->
      <label>Question Text <span class="required">*</span></label>
      <textarea formControlName="text" placeholder="Enter question"></textarea>
      <div class="error" *ngIf="submittedQuestion && questionForm.controls['text'].invalid">
        Question text is required.
      </div>

      <!-- MARKS -->
      <label>Marks <span class="required">*</span></label>
      <input type="number" formControlName="marks">
      <div class="error" *ngIf="submittedQuestion && questionForm.controls['marks'].invalid">
        Marks must be at least 1.
      </div>

      <!-- OPTIONS -->
      <label>Options <span class="required">*</span></label>
      <div formArrayName="options" class="options-container">
        <div *ngFor="let opt of options.controls; let i = index">
          <input [formControlName]="i" placeholder="Option {{ i + 1 }}">
          <div class="error" *ngIf="submittedQuestion && opt.invalid">
            Option {{ i + 1 }} is required.
          </div>
        </div>
      </div>

      <!-- CORRECT ANSWER -->
      <label>Correct Answer <span class="required">*</span></label>
      <select formControlName="correctAnswerIndex">
        <option *ngFor="let opt of options.controls; let i = index" [value]="i">
          Option {{ i + 1 }}
        </option>
      </select>

      <button class="btn-success" type="button" (click)="addQuestion()">
        Add Question
      </button>

      <button class="btn-secondary" type="button" (click)="completeModule()">
        Complete Module
      </button>

    </div>
  </div>
</div>
