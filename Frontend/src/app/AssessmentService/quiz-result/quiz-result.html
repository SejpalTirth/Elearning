<div class="result-wrapper" *ngIf="!loading">

  <div class="result-card">

    <h2>Quiz Result</h2>

    <div class="score-section">
      <p><span>Score:</span> {{ result.obtainedMarks }} / {{ result.totalMarks }}</p>
      <p><span>Percentage:</span> {{ result.percentage }}%</p>
    </div>

    <div class="status"
      [ngClass]="result.passed ? 'passed' : 'failed'">

      <span class="status-icon">
        {{ result.passed ? '🎉' : '❌' }}
      </span>

      <span class="status-text">
        {{ result.passed ? 'Passed' : 'Failed' }}
      </span>
    </div>

    <button class="back-btn" (click)="backToModules()">
      Return to Modules
    </button>
  </div>
</div>

<div *ngIf="loading" class="loading">
  Loading result...
</div>
