<h2>Manage Users</h2>

@if (loading) {
  <div>Loading users...</div>
}

@if (!loading) {

  <table border="1" cellpadding="8">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Action</th>
    </tr>

    @for (user of users; track user.id) {
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button (click)="openRoleModal(user)">Change Role</button>
        </td>
      </tr>
    }
  </table>
}

@if (selectedUser) {
  <div class="modal">
    <div class="modal-content">

      <h3>Change role for: {{ selectedUser.name }}</h3>

      <select [(ngModel)]="selectedRoleId">
        <option value="">Select Role</option>

        @for (r of roles; track r.id) {
          <option [value]="r.id">{{ r.name }}</option>
        }
      </select>

      <div class="modal-actions">
        <button (click)="updateRole()" [disabled]="updating">Update</button>
        <button (click)="selectedUser = null">Cancel</button>
      </div>
    </div>
  </div>
}
