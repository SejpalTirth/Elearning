<div class="modules-container">

  <h2>Modules</h2>

  @if (loading) {
    <div class="loading">Loading modules...</div>
  }

  @if (!loading && modules.length === 0) {
    <div class="empty">
      No modules found for this course.
    </div>
  }

  @if (!loading && modules.length > 0) {

    @for (m of modules; track m.id) {

      <div
        class="module-card"
        role="button"
        tabindex="0"
        (click)="openModule(m.id)"
        (keydown.enter)="openModule(m.id)"
        (keydown.space)="openModule(m.id)"
        [class.completed]="m.isCompleted"
      >
        <div class="module-header">
          <h3>{{ m.title }}</h3>

          @if (m.isCompleted) {
            <span class="status completed-status">Completed</span>
          }

          @if (!m.isCompleted) {
            <span class="status pending-status">Pending</span>
          }
        </div>
      </div>

    }

  }

</div>
