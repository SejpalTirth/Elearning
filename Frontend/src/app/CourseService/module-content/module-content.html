<app-loading-overlay #loader></app-loading-overlay>

@if (isLoaded) {

  @if (module) {

    <div class="module-container">

      <h1>{{ module.title }}</h1>

      <div class="content-box">
        <p>{{ module.content }}</p>
      </div>

      @if (quizStatus) {

        <div class="quiz-area">

          @if (!quizStatus.alreadyPassed && !quizStatus.attempted) {
            <!-- First attempt -->
            <button 
              class="quiz-btn primary"
              (click)="takeQuiz()">
              Take Quiz
            </button>
          }

          @if (quizStatus.attempted && !quizStatus.alreadyPassed) {
            <!-- Retake -->
            <button 
              class="quiz-btn warning"
              (click)="takeQuiz()">
              Retake Quiz
            </button>
          }

          @if (quizStatus.alreadyPassed) {
            <!-- Completed -->
            <button 
              class="quiz-btn disabled"
              disabled>
              ✔ Completed
            </button>
          }
        </div>
      }
    </div>
  }
}
