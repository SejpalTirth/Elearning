@if(course)
{
  <div class="details-container">
    @if(isLoading)
    {
      <div class="loading-overlay">
        <div class="loader"></div>
          <p>Enrolling...</p>
      </div>
    }

    <!-- HEADER -->
    <div class="course-header">
      <h1>{{ course.title }}</h1>
      <p class="instructor">Instructor: {{ course.instructorName }}</p>
    </div>

    <!-- COURSE CARD -->
    <div class="course-card">
      <h3>Description</h3>
      <p>{{ course.description }}</p>

      <button 
        class="enroll-btn"
        [disabled]="btnLoading"
        (click)="enrollOrContinue()">

        @if(btnLoading)
        {
          <span class="btn-spinner"></span>
        }

        {{ btnLoading ? 'Processing...' : (isEnrolled ? 'Continue Learning' : 'Enroll Now') }}
      </button>
    </div>
  </div>
}
@if(course)
{
  <div class="details-container"></div> 
}
@if(!course)
{
  <div class="loading">
    Loading course details...
  </div>
}
