<div class="learning-container">
  <h2>My Learning</h2>

  <div *ngIf="loading" class="loading">
    Loading your enrolled courses...
  </div>

  <div *ngIf="!loading && courses.length === 0" class="empty">
    You haven't enrolled in any courses yet.
  </div>

  <div *ngFor="let c of courses" class="learning-card">

    <h3>{{ c.title }}</h3>
    <p class="instructor">Instructor: {{ c.instructor?.name }}</p>

    <!-- Progress Bar -->
    <div class="progress-wrapper">
      <div class="progress-bar" [style.width]="c.progressPercent + '%'"></div>
    </div>

    <p class="progress-text">{{ c.progressPercent }}% Completed</p>


    <button (click)="continueLearning(c.id)">
      Continue Learning
    </button>

  </div>
</div>
