<div class="course-container">

  <h2 class="title">Available Courses</h2>

  @if (loading) {
    <div class="loading">Loading courses...</div>
  }

  @if (!loading) {

    <div class="grid">

      @for (c of courses; track c.id) {

        <div
          class="course-card"
          role="button"
          tabindex="0"
          (click)="openCourse(c.id)"
          (keydown.enter)="openCourse(c.id)"
          (keydown.space)="openCourse(c.id)"
        >
          <h3>{{ c.title }}</h3>

          <!-- description -->
          <p class="description">{{ c.description }}</p>

          <span class="instructor">{{ c.instructor?.name }}</span>
        </div>

      }

    </div>

  }
</div>
