<nav class="navbar">

  <div class="logo">
    <a routerLink="/">E-Learning</a>
  </div>

  @if (loggedIn) {
    <div class="menu">

      @for (item of visibleMenu; track item.route) {
        <a [routerLink]="item.route">{{ item.label }}</a>
      }

      <div
        class="user-box"
        tabindex="0"
        role="button"
        (click)="toggleDropdown()"
      >
        <span class="user-name">{{ userName }}</span>

        @if (dropdownOpen) {
          <div class="dropdown">
            <button (click)="logout()">Logout</button>
          </div>
        }
      </div>

    </div>
  }

</nav>
