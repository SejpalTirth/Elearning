<h2 class="page-title">Manage Users</h2>

@if (loading) {
  <div class="loading">Loading users...</div>
}

@if (!loading) {

  <div class="table-wrapper">
    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th class="action-col">Action</th>
        </tr>
      </thead>

      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>

            <td>
              <span class="role-badge {{ user.role.toLowerCase() }}">
                {{ user.role }}
              </span>
            </td>

            <td class="action-col">
              <button class="btn-outline" (click)="openRoleModal(user)">
                Change Role
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}

<!-- ================= MODAL ================= -->

@if (selectedUser) {
  <div class="modal-overlay">
    <div class="modal-card">

      <h3>Change role</h3>
      <p class="user-name">{{ selectedUser.name }}</p>

      <label for="roleSelect" class="field-label">
        Select Role
      </label>

      <select
        id="roleSelect"
        class="role-select"
        [(ngModel)]="selectedRoleId"
        required
      >
      <!-- Placeholder -->
      <option value="" disabled>
        -- Select role --
      </option>

      @for (r of roles; track r.id) {
        <option [value]="r.id">
          {{ r.name }}
        </option>
      }
      </select>


      <div class="modal-actions">
        <button
          class="btn-primary"
          (click)="updateRole()"
          [disabled]="updating || !selectedRoleId"
        >
          Update
        </button>

        <button
          class="btn-secondary"
          (click)="selectedUser = null"
        >
          Cancel
        </button>
      </div>

    </div>
  </div>
}
