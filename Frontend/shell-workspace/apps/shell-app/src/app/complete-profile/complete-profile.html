<div class="container">
  <h2>Complete Your Profile</h2>

  <label class="label" for="fullName">Full Name</label>
  <input 
    id="fullName"
    type="text"
    class="form-input"
    [(ngModel)]="name"
    placeholder="Enter your name"
  />

  <label class="label" for="roleSelect">Select Role</label>
  <select
    id="roleSelect"
    class="form-input"
    [(ngModel)]="roleId"
  >
    <option [value]="3">Student</option>
    <option [value]="2">Instructor</option>
  </select>

  <button class="btn" (click)="saveProfile()" [disabled]="loading">
    {{ loading ? "Saving..." : "Submit" }}
  </button>
</div>
